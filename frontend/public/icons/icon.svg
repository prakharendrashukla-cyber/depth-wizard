<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a10" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#21262d" stroke-width="4" />

  <!-- Depth Elevation Waves / Grid Background -->
  <g opacity="0.35" stroke="#58a6ff" stroke-width="2" fill="none">
    <path d="M 64 360 C 140 320, 200 380, 256 350 C 320 310, 380 370, 448 340" />
    <path d="M 64 390 C 130 350, 210 420, 256 380 C 310 340, 390 410, 448 370" stroke="#79c0ff" />
    <path d="M 64 420 C 150 380, 190 440, 256 410 C 330 380, 370 430, 448 400" stroke="#bc8cff" />
    <path d="M 64 450 C 120 420, 220 470, 256 440 C 300 410, 400 460, 448 430" stroke="#d2a8ff" />
  </g>

  <!-- Foreground Depth Terrain Wave Ribbon -->
  <path d="M 70 420 Q 180 340 256 370 T 442 360 L 442 450 Q 330 460 256 440 T 70 450 Z" 
        fill="url(#waveGrad)" />

  <!-- Wizard Hat -->
  <!-- Brim -->
  <ellipse cx="256" cy="310" rx="130" ry="32" fill="#1f242c" stroke="#58a6ff" stroke-width="4" filter="url(#glow)" />
  <ellipse cx="256" cy="308" rx="124" ry="26" fill="url(#hatGrad)" opacity="0.4" />

  <!-- Hat Cone -->
  <path d="M 170 295 C 190 220, 220 140, 250 80 C 260 60, 290 85, 280 115 C 270 145, 290 190, 305 245 C 315 280, 335 290, 342 295 C 290 320, 220 320, 170 295 Z" 
        fill="url(#hatGrad)" stroke="#bc8cff" stroke-width="3" />

  <!-- Hat Band -->
  <path d="M 172 292 C 210 315, 302 315, 340 292 C 335 278, 330 268, 328 262 C 290 282, 220 282, 184 262 C 180 270, 175 280, 172 292 Z" 
        fill="#080a10" stroke="#58a6ff" stroke-width="2" />

  <!-- Magic Sparkles / Stars -->
  <!-- Star 1 (Tip of Hat) -->
  <path d="M 250 70 Q 250 80 260 80 Q 250 80 250 90 Q 250 80 240 80 Q 250 80 250 70 Z" 
        fill="#ffffff" filter="url(#glow)" />
  <!-- Star 2 -->
  <path d="M 360 140 Q 360 152 372 152 Q 360 152 360 164 Q 360 152 348 152 Q 360 152 360 140 Z" 
        fill="#58a6ff" filter="url(#glow)" />
  <!-- Star 3 -->
  <path d="M 140 180 Q 140 190 150 190 Q 140 190 140 200 Q 140 190 130 190 Q 140 190 140 180 Z" 
        fill="#bc8cff" filter="url(#glow)" />
  <!-- Small Star 4 -->
  <circle cx="380" cy="220" r="3" fill="#79c0ff" />
  <circle cx="125" cy="250" r="2.5" fill="#d2a8ff" />
  <circle cx="295" cy="60" r="3" fill="#ffffff" />
</svg>
